set-window-option -g xterm-keys on

setw -g mode-keys vi

set-option -g default-terminal "xterm-256color"
unbind C-Left
unbind C-Right

# THEME
set -g status-bg black
set -g status-fg white
#set -g window-status-current-bg white
#set -g window-status-current-fg black
#set -g window-status-current-attr bold
set -g status-interval 1
set -g status-left-length 30
set -g status-left '#[fg=green](#S) #(whoami) '
set -g status-right '#[fg=yellow]#(cut -d " " -f 1-3 /proc/loadavg)#[default] #[fg=white]%H:%M#[default]'

#set-option -g pane-active-border-fg blue
set-option -g repeat-time 0

bind p paste-buffer
bind-key    -T copy-mode-vi    v           send-keys -X begin-selection
bind-key    -T copy-mode-vi    y           send-keys -X copy-pipe "xclip -sel clip -i"

bind-key    -T copy-mode-vi C-left send-keys -X previous-space                                                   
bind-key    -T copy-mode-vi C-right send-keys -X next-space-end   


bind-key -n PPage if-shell -F \
     '#{||:#{==:#{pane_current_command},vim},#{==:#{pane_current_command},nvim}}' \
     'send-keys PPage' \
     'copy-mode -eu'

bind-key -T copy-mode PPage send-keys -X page-up
bind-key -T copy-mode NPage send-keys -X page-down
# Also needed if tmux uses vi-mode copy keys:
bind-key -T copy-mode-vi PPage send-keys -X page-up
bind-key -T copy-mode-vi NPage send-keys -X page-down

set -g history-limit 200000
set -g allow-rename off
set -g bell-action any

